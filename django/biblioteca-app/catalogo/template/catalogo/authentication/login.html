<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
    </head>
    <body>
        <h1>Control de acceso</h1>
        <h2> sistema de gestion bibliotecaria</h2>
        {% if form.errors %}
            <p style="color:blueviolet">Usuario o contraseña incorrectos. Por favor, inténtelo de nuevo.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Iniciar sesión</button>
        </form>
    </body>
</html>
